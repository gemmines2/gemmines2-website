name: Rebuild product pages

# Runs automatically every time products-data.js changes on main
# (which happens whenever the product manager commits a new/edited product).
# It regenerates product/<id>.html and products.html so nothing ever
# goes live with a missing detail page again.

on:
  push:
    branches: [main]
    paths:
      - 'products-data.js'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate per-product pages
        run: node build-product-pages.js

      - name: Generate products.html
        run: node build-products-page.js

      - name: Commit regenerated pages (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add product/ products.html
          git diff --staged --quiet || git commit -m "Auto-rebuild product pages [skip ci]"
          git push
